<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maom Projects | CSE-H</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><span></span><span></span><span></span></div>
  <canvas id="snow" aria-hidden="true"></canvas>

  <header class="opening">
    <div class="glass hero-card">
      <img id="logo" class="logo" src="assets/logo.jpeg" alt="Logo" hidden>
      <h1>Maom Projects</h1>
      <p class="section-name">CSE-H</p>
    </div>
    <a class="scroll-hint" href="#team" aria-label="Scroll down">&#8964;</a>
  </header>

  <main>
    <section id="team" class="glass block">
      <h2>Team Members</h2>
      <ul class="team-list" id="team-list"></ul>
      <p class="status" id="team-status" role="status"></p>
    </section>

    <section id="projects" class="glass block">
      <h2>Projects</h2>
      <ol class="project-list" id="project-list"></ol>
      <p class="status" id="projects-status" role="status"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
